name: Amazon Review Request Batch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: check eligible orders only / false: send review requests"
        required: true
        default: "true"
      max_requests_per_run:
        description: "Maximum eligible orders to process in one run"
        required: true
        default: "200"
  schedule:
    # 03:10 JST daily. GitHub Actions cron uses UTC.
    - cron: "10 18 * * *"

permissions:
  contents: read

jobs:
  request-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: scripts/amazon_review_request

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Amazon review request batch
        env:
          LWA_CLIENT_ID: ${{ secrets.LWA_CLIENT_ID }}
          LWA_CLIENT_SECRET: ${{ secrets.LWA_CLIENT_SECRET }}
          LWA_REFRESH_TOKEN: ${{ secrets.LWA_REFRESH_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AMAZON_SP_API_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AMAZON_SP_API_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AMAZON_SP_API_AWS_SESSION_TOKEN }}
          AWS_ROLE_ARN: ${{ secrets.AMAZON_SP_API_ROLE_ARN }}
          MARKETPLACE_ID: ${{ secrets.AMAZON_MARKETPLACE_ID }}
          SP_API_REGION: ${{ vars.SP_API_REGION || 'FE' }}
          ORDER_LOOKBACK_DAYS: ${{ vars.ORDER_LOOKBACK_DAYS || '30' }}
          ORDER_MIN_AGE_DAYS: ${{ vars.ORDER_MIN_AGE_DAYS || '5' }}
          MAX_REQUESTS_PER_RUN: ${{ github.event.inputs.max_requests_per_run || vars.MAX_REQUESTS_PER_RUN || '200' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.AMAZON_REVIEW_REQUEST_DRY_RUN || 'true' }}
          SKIP_IF_MISSING_SECRETS: "true"
        run: python request_review_batch.py
